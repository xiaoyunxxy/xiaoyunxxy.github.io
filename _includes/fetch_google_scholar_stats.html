<script>
    document.addEventListener('DOMContentLoaded', function () {
        {% if site.google_scholar_stats_use_cdn %}
        var gsDataBaseUrl = 'https://cdn.jsdelivr.net/gh/{{ site.repository }}@'
        {% else %}
        var gsDataBaseUrl = 'https://raw.githubusercontent.com/{{ site.repository }}/'
        {% endif %}
        fetch(gsDataBaseUrl + "google-scholar-stats/gs_data.json").then(function (response) {
            if (!response.ok) throw new Error('Citation data unavailable');
            return response.json();
        }).then(function (data) {
            var totalCitation = document.getElementById('total_cit');
            if (totalCitation) totalCitation.textContent = data['citedby'];
            var citationEles = document.getElementsByClassName('show_paper_citations')
            Array.prototype.forEach.call(citationEles, element => {
                var paperId = element.getAttribute('data')
                var publication = data['publications'] && data['publications'][paperId];
                if (publication && publication['num_citations'] != null) {
                    element.textContent = '| Citations: ' + publication['num_citations'];
                }
            });
        }).catch(function () { /* Citation counts are optional when offline. */ });
    })
</script>
