<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <a class="site-brand" href="{{ '/' | relative_url }}">{{ site.author.name }}</a>
      <nav id="{% if page.town %}town-nav{% else %}site-nav{% endif %}" class="greedy-nav{% if page.town %} town-nav{% endif %}" aria-label="Main navigation">
        <button aria-label="More navigation links"{% if page.town %} aria-expanded="false" aria-controls="town-nav-links"{% endif %}><div class="navicon"></div></button>
        <ul class="visible-links"{% if page.town %} id="town-nav-links"{% endif %}>
          {% for link in site.data.navigation.main %}
            <li class="masthead__menu-item"><a href="{{ domain }}{{ link.url }}">{{ link.title }}</a></li>
          {% endfor %}
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>
  </div>
</div>
